[project]
name = "value-axis-single-turn-control"
version = "0.1.0"
description = "Single-turn coding control (METHOD.tex Stage 2): frozen value axis vs. DebugBench correctness"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "pyarrow>=14.0.0",
    "datasets>=2.19.0",
]

[project.scripts]
stc-prepare = "single_turn_control.prepare:main"
stc-run = "single_turn_control.run_control:main"
stc-analyze = "single_turn_control.analyze:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["single_turn_control*", "tests*"]
